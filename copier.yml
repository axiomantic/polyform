_subdirectory: template
_answers_file: .copier-answers.yml
_min_copier_version: "9.0.0"

# ----------------------------------------------------------------------
# 1. Project Identity & Metadata
# ----------------------------------------------------------------------
project_name:
  type: str
  help: "Human-readable project title or slug (e.g. My Fast Math or fast-math)"
  default: "my-project"
  validator: >-
    {% if not project_name | regex_search('^[a-zA-Z0-9_ -]+$') %}
    Project name must contain only letters, numbers, spaces, underscores, or dashes.
    {% endif %}

repo_name:
  type: str
  help: "GitHub repository slug (kebab-case, e.g. fast-math)"
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: >-
    {% if not repo_name | regex_search('^[a-z0-9][a-z0-9-]+$') %}
    Repository name must be kebab-case lowercase alphanumeric.
    {% endif %}

package_name:
  type: str
  help: "Nim / Python / C-symbol package identifier (snake_case, e.g. fast_math)"
  default: "{{ repo_name | replace('-', '_') }}"
  validator: >-
    {% if not package_name | regex_search('^[a-z][a-z0-9_]+$') %}
    Package identifier must be snake_case starting with a lowercase letter.
    {% endif %}

description:
  type: str
  help: "Concise summary of project purpose"
  default: "Production-grade project built with Axiomantic standards."

author_name:
  type: str
  help: "Author or organization maintainer name"
  default: "Axiomantic Maintainers"

author_email:
  type: str
  help: "Author contact email"
  default: "maintainers@axiomantic.org"

github_owner:
  type: str
  help: "GitHub user or organization handle"
  default: "axiomantic"

# ----------------------------------------------------------------------
# 2. Composable Language & Toolchain Facets
# ----------------------------------------------------------------------
flavor:
  type: str
  when: false
  default: "custom"

has_nim:
  type: bool
  help: "Include Nim toolchain (Nimble, nph, compiler matrix)?"
  default: "{{ flavor in ['pure_nim', 'nim_ts_wasm', 'nim_python_wheel', 'headerkit_binding', 'custom', ''] }}"

has_python:
  type: bool
  help: "Include Python toolchain (uv, ruff, pytest)?"
  default: "{{ flavor == 'nim_python_wheel' }}"

has_typescript:
  type: bool
  help: "Include TypeScript toolchain (package.json, tsconfig, vitest)?"
  default: "{{ flavor == 'nim_ts_wasm' }}"

has_c_cpp:
  type: bool
  help: "Include C/C++ foreign interop toolchain (headers, CMake shims)?"
  default: "{{ flavor == 'headerkit_binding' }}"

# ----------------------------------------------------------------------
# 3. Interop Bridge Strategies
# ----------------------------------------------------------------------
python_bridge_strategy:
  type: str
  help: "Python bridge integration strategy"
  choices:
    "phyne (Bidirectional CPython abi3/abi3t + CFFI + lock-free asyncio)": "phyne"
    "nimpy (Nim-Python high-level FFI bindings)": "nimpy"
    "C-ABI / ctypes (scikit-build-core shared library wrapper)": "ctypes_cabi"
    "None (Independent parallel Python package)": "none"
  when: "{{ has_nim and has_python }}"
  default: "{{ 'ctypes_cabi' if flavor == 'nim_python_wheel' else 'phyne' }}"

python_freethreaded_ci:
  type: bool
  help: "Include Free-Threaded Python (3.13t, 3.14t / PEP 703 nogil) in CI matrix and cibuildwheel?"
  when: "{{ has_python }}"
  default: true

nimony_ci:
  type: bool
  help: "Include Nimony (Nim 3.0 preview) compatibility check in Nim CI workflow and justfile?"
  when: "{{ has_nim }}"
  default: true

ts_bridge_strategy:
  type: str
  help: "TypeScript bridge integration strategy"
  choices:
    "WebAssembly (WASM compiler, browser/Node runtime)": "wasm"
    "N-API (Node native addon bindings)": "napi"
    "None (Independent parallel TypeScript package)": "none"
  when: "{{ has_nim and has_typescript }}"
  default: "wasm"

c_binding_strategy:
  type: str
  help: "C/C++ binding integration strategy"
  choices:
    "HeaderKit (headerkit.toml, automated FFI wrapper generator)": "headerkit"
    "CMake Static / Shared library": "cmake_static"
    "None (Direct foreign header compilation)": "none"
  when: "{{ has_nim and has_c_cpp }}"
  default: "headerkit"

# ----------------------------------------------------------------------
# 4. Documentation Engine Selection
# ----------------------------------------------------------------------
docs_engine:
  type: str
  help: "Documentation portal engine"
  choices:
    "Astro Starlight (Axiomantic standard with automated AST docgen and Mermaid)": "starlight"
    "None (Skip documentation site)": "none"
  default: "starlight"

# ----------------------------------------------------------------------
# 5. Ecosystem Features & Review Tooling
# ----------------------------------------------------------------------
enable_momus_review:
  type: bool
  help: "Include Axiomantic Momus AI PR review workflow (.github/workflows/momus.yml)?"
  default: true

momus_model:
  type: str
  help: "Model identifier for Momus PR review (OpenRouter / OpenAI compatible)"
  default: "~anthropic/claude-sonnet-latest"
  when: "{{ enable_momus_review }}"

momus_base_url:
  type: str
  help: "API base URL for Momus PR review endpoint"
  default: "https://openrouter.ai/api/v1"
  when: "{{ enable_momus_review }}"

license:
  type: str
  help: "Software license"
  choices:
    - "MIT"
    - "Apache-2.0"
    - "BSD-3-Clause"
    - "Unlicense"
  default: "MIT"

# ----------------------------------------------------------------------
# 6. Conditional File Exclusion Rules
# ----------------------------------------------------------------------
_exclude:
  # Universal hygiene
  - ".git"
  - ".DS_Store"
  - "*.pyc"
  - "__pycache__"

  # 1. Nim payload exclusions
  - "{% if not has_nim %}/{{ package_name }}.nimble{% endif %}"
  - "{% if not has_nim %}src{% endif %}"
  - "{% if not has_nim and not has_typescript and not (has_c_cpp and (c_binding_strategy | default('none')) == 'headerkit') %}tests{% endif %}"
  - "{% if not has_nim %}/nim.cfg{% endif %}"
  - "{% if not has_nim %}tests/config.nims{% endif %}"
  - "{% if not has_nim %}tests/test_{{ package_name }}.nim{% endif %}"

  # 2. Python payload exclusions
  - "{% if not has_python %}pyproject.toml{% endif %}"
  - "{% if not has_python %}src_py{% endif %}"
  - "{% if not has_python %}tests_py{% endif %}"

  # 3. TypeScript payload exclusions
  - "{% if not has_typescript %}/package.json{% endif %}"
  - "{% if not has_typescript %}/package-lock.json{% endif %}"
  - "{% if not has_typescript %}/tsconfig.json{% endif %}"
  - "{% if not has_typescript %}vitest.config.ts{% endif %}"
  - "{% if not has_typescript %}ts{% endif %}"

  # 4. Foreign C/C++ exclusions
  - "{% if not has_c_cpp %}include{% endif %}"
  - "{% if not (has_c_cpp or (has_nim and has_python and (python_bridge_strategy | default('none')) in ['ctypes_cabi', 'phyne'])) %}CMakeLists.txt{% endif %}"

  # 5. Overlap Bridge exclusions
  - "{% if not (has_nim and has_typescript and (ts_bridge_strategy | default('none')) == 'wasm') %}scripts/compile_wasm.sh{% endif %}"
  - "{% if not has_typescript %}tests/test_ts_bridge.ts{% endif %}"
  - "{% if not (has_nim and has_python) %}.github/workflows/cibuildwheel.yml{% endif %}"
  - "{% if not (has_nim and has_c_cpp and (c_binding_strategy | default('none')) == 'headerkit') %}headerkit.toml{% endif %}"
  - "{% if not (has_nim and has_c_cpp and (c_binding_strategy | default('none')) == 'headerkit') %}scripts/generate_bindings.py{% endif %}"
  - "{% if not (has_nim and has_c_cpp and (c_binding_strategy | default('none')) == 'headerkit') %}tests/test_tripwire.nim{% endif %}"

  # Combined scripts exclusion if neither WASM nor HeaderKit scripts are needed
  - "{% if not (has_nim and has_typescript and (ts_bridge_strategy | default('none')) == 'wasm') and not (has_nim and has_c_cpp and (c_binding_strategy | default('none')) == 'headerkit') %}scripts{% endif %}"

  # Documentation engine exclusions
  - "{% if docs_engine == 'none' %}docs{% endif %}"
  - "{% if docs_engine != 'starlight' %}tools{% endif %}"
  - "{% if docs_engine == 'none' %}.github/workflows/docs.yml{% endif %}"
  - "{% if docs_engine != 'starlight' %}docs/astro.config.mjs{% endif %}"

  # Momus review exclusion
  - "{% if not enable_momus_review %}.github/workflows/momus.yml{% endif %}"
  - "{% if not enable_momus_review %}.momus.yaml{% endif %}"

# ----------------------------------------------------------------------
# 7. Post-Copy Lifecycle Tasks
# ----------------------------------------------------------------------
_tasks:
  - "test -d .git || git init -q"
  - >-
    bash -c '
    printf "\n\033[1;36m======================================================================\033[0m\n"
    printf "\033[1;32m  Polyform: Scaffolding Complete for %s\033[0m\n" "{{ repo_name }}"
    printf "  Facets: Nim=%s, Python=%s, TS=%s, C/C++=%s\n" "{{ has_nim }}" "{{ has_python }}" "{{ has_typescript }}" "{{ has_c_cpp }}"
    printf "\033[1;36m======================================================================\033[0m\n"
    printf "  \033[1mNext Steps:\033[0m\n"
    printf "    1. cd %s\n" "{{ repo_name }}"
    printf "    2. just setup\n"
    printf "    3. just test\n"
    printf "  \033[1;33mReview NEXT_STEPS.md for tailored checklists and CI secrets setup.\033[0m\n"
    printf "\033[1;36m======================================================================\033[0m\n\n"
    '
