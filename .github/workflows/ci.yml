name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: {}

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install and run Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --verbose --redact

  fixture-matrix:
    name: Fixture (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - fixture-pure-nim
          - fixture-pure-py
          - fixture-pure-ts
          - fixture-nim-ts
          - fixture-nim-py
          - fixture-nim-c
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v2
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          parent-nim-install-directory: ${{ runner.temp }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install nph and tools
        run: |
          nimble install -y nph@0.7.0
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - name: Verify fixture ${{ matrix.fixture }}
        run: bash tests/test_fixtures.sh ${{ matrix.fixture }} all
