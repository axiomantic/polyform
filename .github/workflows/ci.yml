name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: {}

jobs:
  fixture-matrix:
    name: Fixture (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - fixture-pure-nim
          - fixture-pure-py
          - fixture-pure-ts
          - fixture-nim-ts
          - fixture-nim-py
          - fixture-nim-c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v2
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          parent-nim-install-directory: ${{ runner.temp }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install nph and tools
        run: |
          nimble install -y nph@0.7.0
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - name: Verify fixture ${{ matrix.fixture }}
        run: bash tests/test_fixtures.sh ${{ matrix.fixture }} all
